name: API Tests (Newman)

# Run on every push and on pull requests
on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API tests with Newman
        run: |
          mkdir -p reports
          newman run "Task 6 - Newman Execution.postman_collection.json" \
            -e Booker-Env.postman_environment.json \
            -r cli,htmlextra,junit \
            --reporter-htmlextra-export reports/report.html \
            --reporter-htmlextra-title "Restful-Booker API Tests (CI)" \
            --reporter-junit-export reports/junit.xml

      # Runs even when the tests fail, so the report is always available
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
